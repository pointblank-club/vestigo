name: Bug report
description: File a bug report to help us improve Vestigo
title: "[Bug]: "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please provide enough detail for us to reproduce and triage quickly.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Briefly describe the issue.
      placeholder: e.g. Ghidra extractor crashes on ARM binaries
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps you followed and any commands you ran.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include stack traces or screenshots if available.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python/Node versions, and any relevant tool versions (Ghidra/Qiling/etc.).
      placeholder: |
        - OS: Ubuntu 22.04
        - Python: 3.11
        - Ghidra: 11.0
        - Qiling: 1.4
  - type: textarea
    id: logs
    attributes:
      label: Logs or stack traces
      description: Paste any relevant output to help diagnose the issue.
      render: shell
